name: xpilot checks

on:
  pull_request:
  push:
    branches: [xpilot]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/msgq_repo
    steps:
    - uses: actions/checkout@v4
    - run: git submodule update --init --depth 1 msgq_repo
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pyzmq numpy pycapnp pytest pytest-subtests cffi zstandard setproctitle cython scons setuptools requests cryptography
    - name: Build msgq
      working-directory: msgq_repo
      run: scons -j4 msgq/ipc_pyx.so
    - uses: actions/checkout@v4
      with:
        repository: Sniper-Eon/xpilot-plugins
        path: xpilot-plugins
    - name: Generated files are current
      run: |
        python3 openpilot/tesla/plugins/gen_params.py --check
        python3 openpilot/tesla/plugins/gen_safety.py --check
    - name: Auto-merge classifier
      run: python3 tools/ci/pr_risk.py --check
    - name: XPILOT.md section 11 host checks
      run: |
        set -e
        for check in static_imports tile_layout_check plugin_host_check manifest_check safety_manifest_check \
                     phase2_check phase3_check phase4_check store_check offroad_pages_check agnos_update_check lane_context_check subscription_recovery_check ui_translation_check; do
          echo "::group::$check"
          python3 tools/sp_tesla_e2e/$check.py > /tmp/$check.json
          echo "::endgroup::"
        done
    - name: Plugin repository end to end
      run: python3 tools/sp_tesla_e2e/store_e2e.py --repo xpilot-plugins
    - name: Paired fork routing
      run: python3 tools/sp_tesla_e2e/fork_pair_check.py --repo xpilot-plugins
    - name: Native safety tests
      working-directory: opendbc_repo
      run: PYTHONPATH=. python3 -m pytest -q opendbc/safety/tests/test_xpilot_plugins.py
    - name: Tell the owner xpilot is broken
      if: failure() && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh issue create --title "xpilot checks failed at ${GITHUB_SHA::10}" --body "@Sniper-Eon $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
